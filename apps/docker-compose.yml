version: '3.8'

services:
  user-service:
    build: 
      context: ..
      dockerfile: apps/user_service/Dockerfile
    container_name: service-user
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - ../.env
    networks:
      - experio-net

  product-service:
    build: 
      context: ..
      dockerfile: apps/product_service/Dockerfile
    container_name: service-product
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    env_file:
      - ../.env
    networks:
      - experio-net

  order-service:
    build: 
      context: ..
      dockerfile: apps/order_service/Dockerfile
    container_name: service-order
    command: uvicorn main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    env_file:
      - ../.env
    networks:
      - experio-net

networks:
  experio-net:
    external: true
